services:
  skrbtso-helper:
    build:
      context: ../..
      dockerfile: tools/skrbtso-helper/Dockerfile
    image: ${HELPER_IMAGE:-local/skrbtso-scrapling-helper:latest}
    container_name: ${APP_NAME:-skrbtso-scrapling-helper}
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SKRBTSO_HELPER_HOST: 0.0.0.0
      SKRBTSO_HELPER_PORT: ${SKRBTSO_HELPER_PORT:-8787}
      SKRBTSO_HELPER_SEARCH_ORIGIN: ${SKRBTSO_HELPER_SEARCH_ORIGIN:-https://skrbtso.top}
      SKRBTSO_HELPER_ALLOWED_SEARCH_HOSTS: ${SKRBTSO_HELPER_ALLOWED_SEARCH_HOSTS:-skrbtso.top}
      SKRBTSO_HELPER_TIMEOUT: ${SKRBTSO_HELPER_TIMEOUT:-180}
      SKRBTSO_HELPER_FORM_RESULT_WAIT: ${SKRBTSO_HELPER_FORM_RESULT_WAIT:-45}
      SKRBTSO_HELPER_DETAIL_WAIT: ${SKRBTSO_HELPER_DETAIL_WAIT:-8}
      SKRBTSO_HELPER_STEALTH_FIRST: ${SKRBTSO_HELPER_STEALTH_FIRST:-1}
      SKRBTSO_HELPER_FORM_FIRST: ${SKRBTSO_HELPER_FORM_FIRST:-1}
      SKRBTSO_HELPER_MAX_CONCURRENT: ${SKRBTSO_HELPER_MAX_CONCURRENT:-1}
      SKRBTSO_HELPER_DEFAULT_MAX_RESULTS: ${SKRBTSO_HELPER_DEFAULT_MAX_RESULTS:-10}
      SKRBTSO_HELPER_MAX_RESULTS_LIMIT: ${SKRBTSO_HELPER_MAX_RESULTS_LIMIT:-20}
      SKRBTSO_HELPER_KEEP_SESSION: ${SKRBTSO_HELPER_KEEP_SESSION:-1}
      SKRBTSO_HELPER_USER_DATA_DIR: /data/.skrbtso-browser
      SKRBTSO_HELPER_EXTRA_POPUP_CANDIDATES: ${SKRBTSO_HELPER_EXTRA_POPUP_CANDIDATES:-2}
      SKRBTSO_HELPER_CACHE_TTL: ${SKRBTSO_HELPER_CACHE_TTL:-21600}
      SKRBTSO_HELPER_RESULT_POLL_MS: ${SKRBTSO_HELPER_RESULT_POLL_MS:-500}
      SKRBTSO_HELPER_CORS_ORIGIN: "${SKRBTSO_HELPER_CORS_ORIGIN:-*}"
    volumes:
      - ./skrbtso-browser:/data/.skrbtso-browser
    ports:
      - "${HELPER_BIND_HOST:-127.0.0.1}:${SKRBTSO_HELPER_PORT:-8787}:${SKRBTSO_HELPER_PORT:-8787}"
